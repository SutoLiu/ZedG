name: 06 更新 Homebrew Cask

# ZedG Release 发布后，自动生成 macOS aarch64 cask 并推送到
# WenYin-Community/homebrew-zedg。需要仓库 Secret: TAP_GITHUB_TOKEN
# （fine-grained PAT，对 scoop-zedg 与 homebrew-zedg 有 Contents 写权限）。

on:
  release:
    types: [published]
  # 02 构建用 GITHUB_TOKEN 创建 release，不会触发上方 release 事件，
  # 因此监听构建工作流完成。
  workflow_run:
    workflows: ["02 构建发行"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release tag（如 v1.26.2，留空取最新 stable）"
        required: false
        type: string

permissions:
  contents: read

jobs:
  update-tap:
    runs-on: ubuntu-latest
    steps:
      - name: 确定目标版本
        env:
          GH_REPO: ${{ github.repository }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.version_tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "构建未成功，跳过"; echo "SKIP=true" >> $GITHUB_ENV; exit 0
          fi
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ -n "$EVENT_TAG" ]; then
            TAG="$EVENT_TAG"
          else
            TAG=$(curl -s "https://api.github.com/repos/${GH_REPO}/releases/latest" | jq -r .tag_name)
          fi
          IS_PRE=$(curl -s "https://api.github.com/repos/${GH_REPO}/releases/tags/$TAG" | jq -r '.prerelease // false')
          if [ "$IS_PRE" = "true" ] && [ -z "$INPUT_TAG" ]; then
            echo "跳过 pre-release: $TAG"
            echo "SKIP=true" >> $GITHUB_ENV
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "目标版本: $TAG (prerelease=$IS_PRE)"

      - name: 等待并获取 macOS DMG
        if: env.SKIP != 'true'
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          for i in $(seq 1 20); do
            JSON=$(curl -s "https://api.github.com/repos/${GH_REPO}/releases/tags/$TAG")
            URL_ARM=$(echo "$JSON" | jq -r '.assets[] | select(.name | test("macos-aarch64.*\\.dmg$")) | .browser_download_url' | head -1)
            if [ -n "$URL_ARM" ] && [ "$URL_ARM" != "null" ]; then
              echo "ASSET_ARM=$URL_ARM" >> $GITHUB_ENV
              break
            fi
            echo "[$i/20] 产物未就绪，等待 15s..."
            sleep 15
          done
          [ -n "$URL_ARM" ] || { echo "::error::未找到 $TAG 的 macOS aarch64 DMG"; exit 1; }

      - name: 生成 Cask
        if: env.SKIP != 'true'
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          CLEAN="${TAG#v}"
          HASH_ARM=$(tmp=$(mktemp); curl -sL -o "$tmp" "$ASSET_ARM"; sha256sum "$tmp" | awk '{print $1}'; rm -f "$tmp")

          mkdir -p Casks
          cat > Casks/zedg.rb <<CASK
          cask "zedg" do
            version "$CLEAN"
            sha256 "$HASH_ARM"

            url "https://github.com/${GH_REPO}/releases/download/v#{version}/zedg-zh-cn-macos-aarch64-v#{version}.dmg"
            name "ZedG"
            desc "Zed Editor (Localized / 汉化版)"
            homepage "https://github.com/${GH_REPO}"

            depends_on arch: :arm64
            depends_on macos: ">= :ventura"

            app "ZedG.app"

            postflight do
              system_command "/usr/bin/xattr",
                             args: ["-rd", "com.apple.quarantine", "#{appdir}/ZedG.app"]
            end

            zap trash: [
              "~/Library/Application Support/Zed",
              "~/Library/Caches/dev.zed.ZedG",
              "~/Library/Preferences/dev.zed.ZedG.plist",
            ]
          end
          CASK
          echo "--- zedg.rb ---"
          cat Casks/zedg.rb

      - name: 推送到发布源
        if: env.SKIP != 'true'
        env:
          TAP_PAT: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          [ -n "$TAP_PAT" ] || { echo "::error::未配置 TAP_GITHUB_TOKEN secret"; exit 1; }
          git clone --depth 1 "https://x-access-token:${TAP_PAT}@github.com/WenYin-Community/homebrew-zedg.git" /tmp/tap
          cd /tmp/tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          mkdir -p Casks
          cp "$GITHUB_WORKSPACE/Casks/zedg.rb" Casks/zedg.rb
          git add Casks/zedg.rb
          if git diff --cached --quiet; then
            echo "Cask 无变化，跳过"
          else
            git commit -m "chore: 更新 zedg 到 $TAG"
            git push origin main
            echo "已推送 Casks/zedg.rb ($TAG)"
          fi
