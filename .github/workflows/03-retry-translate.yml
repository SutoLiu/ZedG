name: 03 补翻译（不构建）

# 用途：不依赖上游新版本，单纯提升现有版本的翻译覆盖率。
# 适用于限时免费 API 场景，可分批多次执行，结果累积到 i18n 分支。

on:
  workflow_dispatch:
    inputs:
      version:
        description: "目标版本（如 v1.26.2，留空则取 i18n 分支最新版本目录）"
        type: string
        default: ""
      lang:
        description: "目标语言"
        type: choice
        options:
          - zh-CN
        default: zh-CN
      limit:
        description: "本次最多补翻条数（0 为不限）"
        type: string
        default: "500"
      concurrency:
        description: "AI 并发数（免费额度紧张时建议 3-5）"
        type: string
        default: "5"
      chain:
        description: "补翻后是否重新构建发布"
        type: boolean
        default: false

  # 每天北京时间 13:00 自动补翻，与 01 的 12:00 错开
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: write

concurrency:
  group: retry-translate
  cancel-in-progress: false

env:
  ZED_REPO: https://github.com/zed-industries/zed.git

jobs:
  retry:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: pip install ".[ai]"

      - name: 检查 AI 密钥
        env:
          AI_KEY: ${{ secrets.AI_API_KEY }}
        run: |
          if [ -z "$AI_KEY" ]; then
            echo "::error::未配置 AI_API_KEY，无法执行补翻译"
            exit 1
          fi
          echo "AI 密钥已配置"

      - name: 从 i18n 分支获取现有译文
        run: |
          if ! git fetch origin i18n 2>/dev/null; then
            echo "::error::i18n 分支不存在"
            exit 1
          fi
          git checkout origin/i18n -- string.json 2>/dev/null || true
          git checkout origin/i18n -- string_context.json 2>/dev/null || true
          git checkout origin/i18n -- scan_result.json 2>/dev/null || true
          git checkout origin/i18n -- i18n/ 2>/dev/null || true
          if [ -f string.json ]; then
            echo "待译列表: $(wc -c < string.json) 字节"
          else
            echo "::warning::i18n 分支暂无 string.json，将在克隆源码后重新提取"
          fi

      - name: 确定版本与参数
        id: params
        run: |
          # schedule 触发时 inputs 为空或渲染成字符串 null，统一兜底
          sane() {
            case "$1" in ""|"null") echo "$2" ;; *) echo "$1" ;; esac
          }

          V=$(sane "${{ inputs.version }}" "")
          if [ -z "$V" ]; then
            V=$(ls -d i18n/v*/ 2>/dev/null | sed 's|i18n/||;s|/||' | sort -V | tail -1)
          fi
          if [ -z "$V" ]; then
            echo "::error::i18n 分支中未找到版本目录"
            exit 1
          fi

          LANG_V=$(sane "${{ inputs.lang }}" "zh-CN")
          LIMIT_V=$(sane "${{ inputs.limit }}" "500")
          CONC_V=$(sane "${{ inputs.concurrency }}" "5")

          echo "version=$V" >> $GITHUB_OUTPUT
          echo "lang=$LANG_V" >> $GITHUB_OUTPUT
          echo "limit=$LIMIT_V" >> $GITHUB_OUTPUT
          echo "concurrency=$CONC_V" >> $GITHUB_OUTPUT
          echo "目标版本: $V | 语言: $LANG_V | 上限: $LIMIT_V | 并发: $CONC_V"

          TRANS="i18n/${V}/${LANG_V}.json"
          if [ ! -f "$TRANS" ]; then
            echo "::warning::翻译文件不存在，将新建: $TRANS"
            mkdir -p "i18n/${V}"
            echo '{}' > "$TRANS"
          fi

      - name: 克隆 Zed 源码（仅用于提供翻译上下文）
        env:
          V: ${{ steps.params.outputs.version }}
        run: |
          git clone --depth 1 --branch "$V" $ZED_REPO zed 2>/dev/null \
            || git clone --depth 1 $ZED_REPO zed
          echo "源码就绪: $(du -sh zed | cut -f1)"

      - name: 待译列表缺失时从源码提取
        if: ${{ hashFiles('string.json') == '' }}
        run: |
          echo "string.json 不存在，扫描源码提取（首次运行需要几分钟）..."
          python3 -c "from zedl10n.scan import find_all_rs_files; from zedl10n.extract import extract_all; files=[str(x) for x in find_all_rs_files('zed')]; extract_all(files, 'string.json', 'string_context.json'); print('提取完成: %d 个文件' % len(files))"
          ls -lh string.json string_context.json

      - name: 补翻空译文
        env:
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          AI_CONCURRENCY: ${{ steps.params.outputs.concurrency }}
          V: ${{ steps.params.outputs.version }}
          L: ${{ steps.params.outputs.lang }}
          LIMIT: ${{ steps.params.outputs.limit }}
        run: |
          zedl10n translate \
            --input string.json \
            --output "i18n/${V}/${L}.json" \
            --glossary config/glossary.yaml \
            --source-root zed \
            --mode incremental \
            --retry-empty \
            --rejected-file "i18n/${V}/${L}.rejected.json" \
            --limit "$LIMIT" \
            --lang "$L"

      - name: 统计覆盖率
        env:
          V: ${{ steps.params.outputs.version }}
          L: ${{ steps.params.outputs.lang }}
        run: |
          FILE="i18n/${V}/${L}.json"
          TOTAL=$(jq '[.[] | length] | add // 0' "$FILE")
          FILLED=$(jq '[.[] | to_entries[] | select((.value // "") | length > 0)] | length' "$FILE")
          echo "当前进度: ${FILLED} / ${TOTAL}"
          if [ "$TOTAL" -gt 0 ]; then
            awk -v f="$FILLED" -v t="$TOTAL" 'BEGIN { printf "覆盖率: %.1f%%\n", f/t*100 }'
          fi
          echo "剩余待补: $((TOTAL - FILLED)) 条"

      - name: 推回 i18n 分支
        env:
          V: ${{ steps.params.outputs.version }}
          L: ${{ steps.params.outputs.lang }}
          LIMIT: ${{ steps.params.outputs.limit }}
        run: |
          cp -r i18n/ /tmp/i18n-result/
          rm -rf /tmp/i18n-branch
          git clone --branch i18n --single-branch --depth 1 \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            /tmp/i18n-branch
          mkdir -p /tmp/i18n-branch/i18n
          cp -r /tmp/i18n-result/* /tmp/i18n-branch/i18n/

          # 待译列表与上下文一并入库，后续运行无需重新提取
          for f in string.json string_context.json scan_result.json; do
            if [ -f "$f" ]; then cp "$f" /tmp/i18n-branch/; fi
          done

          cd /tmp/i18n-branch
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f i18n/
          for f in string.json string_context.json scan_result.json; do
            if [ -f "$f" ]; then git add -f "$f"; fi
          done

          if git diff --cached --quiet; then
            echo "翻译无变化，跳过提交"
          else
            git commit -m "chore(i18n): 补翻 ${V}/${L}（本次上限 ${LIMIT} 条）"
            git push origin i18n
            echo "✓ 已推送到 i18n 分支"
          fi

      - name: 触发构建发布（可选）
        if: inputs.chain == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/${{ github.repository }}/dispatches \
            -f event_type=build-ready \
            -f "client_payload[version]=${{ steps.params.outputs.version }}" \
            -f "client_payload[lang]=${{ steps.params.outputs.lang }}" \
            -f "client_payload[is_prerelease]=false"
          echo "已触发 02 构建"
