name: 98 macOS DMG 补发（临时）

# 用途：build-macos-dmg job 失败（x86_64 artifact 残留引用，已修复）时，
# 从已完成 run 的 macOS aarch64 artifacts 直接打 DMG 并补传到现有 Release，
# 无需重跑数小时的全平台编译。

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "源构建 run ID（如 41646647593）"
        required: true
        type: string
      version:
        description: "目标 Release tag（如 v1.26.2）"
        required: true
        type: string
      lang:
        description: "语言"
        default: zh-CN
        type: string

permissions:
  contents: write

jobs:
  publish-macos-dmg:
    runs-on: macos-latest
    env:
      V: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 下载 aarch64 二进制
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          name: zed-macos-aarch64-bin
          path: bins/aarch64

      - name: 下载图标资源
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          name: zed-macos-resources
          path: resources

      - name: 打包 DMG（aarch64）
        run: |
          LANG_LOWER=$(echo "${{ inputs.lang }}" | tr '[:upper:]' '[:lower:]')
          DMG="zedg-${LANG_LOWER}-macos-aarch64-${V}.dmg"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

          chmod +x bins/aarch64/zed bins/aarch64/cli
          strip -x bins/aarch64/zed bins/aarch64/cli

          # === 生成应用图标 ICNS ===
          ICONSET_DIR="AppIcon.iconset"
          mkdir -p "$ICONSET_DIR"
          ICON_SRC="resources/app-icon@2x.png"
          if [ -f "$ICON_SRC" ]; then
            sips -z 16 16     "$ICON_SRC" --out "$ICONSET_DIR/icon_16x16.png"
            sips -z 32 32     "$ICON_SRC" --out "$ICONSET_DIR/icon_16x16@2x.png"
            sips -z 32 32     "$ICON_SRC" --out "$ICONSET_DIR/icon_32x32.png"
            sips -z 64 64     "$ICON_SRC" --out "$ICONSET_DIR/icon_32x32@2x.png"
            sips -z 128 128   "$ICON_SRC" --out "$ICONSET_DIR/icon_128x128.png"
            sips -z 256 256   "$ICON_SRC" --out "$ICONSET_DIR/icon_128x128@2x.png"
            sips -z 256 256   "$ICON_SRC" --out "$ICONSET_DIR/icon_256x256.png"
            sips -z 512 512   "$ICON_SRC" --out "$ICONSET_DIR/icon_256x256@2x.png"
            sips -z 512 512   "$ICON_SRC" --out "$ICONSET_DIR/icon_512x512.png"
            cp "$ICON_SRC"         "$ICONSET_DIR/icon_512x512@2x.png"
            iconutil -c icns "$ICONSET_DIR" -o AppIcon.icns
            echo "应用图标已生成"
          else
            echo "未找到图标源文件 $ICON_SRC"
          fi

          # === binary -> .app -> DMG ===
          make_dmg() {
            local BINARY="$1"
            local DMG_NAME="$2"
            local CLI_BINARY="$3"
            local APP="ZedG-tmp.app"
            mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
            cp "$BINARY" "$APP/Contents/MacOS/zed"
            chmod +x "$APP/Contents/MacOS/zed"
            cp "$CLI_BINARY" "$APP/Contents/MacOS/cli"
            chmod +x "$APP/Contents/MacOS/cli"
            [ -f AppIcon.icns ] && cp AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
            [ -f "resources/Document.icns" ] && cp resources/Document.icns "$APP/Contents/Resources/"
            cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key><string>zed</string>
              <key>CFBundleIdentifier</key><string>dev.zed.ZedG</string>
              <key>CFBundleName</key><string>ZedG</string>
              <key>CFBundleIconFile</key><string>AppIcon</string>
              <key>CFBundlePackageType</key><string>APPL</string>
              <key>CFBundleShortVersionString</key><string>${V}</string>
          </dict>
          </plist>
          PLIST
            local STAGING="dmg-staging-$$"
            mkdir -p "$STAGING"
            mv "$APP" "$STAGING/ZedG.app"
            ln -s /Applications "$STAGING/Applications"
            sleep 3
            local n=0
            until [ "$n" -ge 10 ]; do
              hdiutil create -volname ZedG -srcfolder "$STAGING" -ov -format UDZO "$DMG_NAME" && break
              n=$((n+1))
              echo "hdiutil 失败, 等待 15 秒后重试 ($n/10)..."
              sleep 15
            done
            rm -rf "$STAGING"
            [ -f "$DMG_NAME" ] || { echo "打包 $DMG_NAME 失败"; exit 1; }
            echo "✓ $DMG_NAME ($(du -sh "$DMG_NAME" | cut -f1))"
          }

          make_dmg bins/aarch64/zed "$DMG" bins/aarch64/cli

      - name: 补传 DMG 并更新校验和
        run: |
          gh release upload "$V" "$DMG" --clobber --repo "${{ github.repository }}"

          # 更新 sha256sums.txt（追加 DMG 后整体重传）
          gh release download "$V" --repo "${{ github.repository }}" --pattern sha256sums.txt --clobber
          if ! grep -q "$DMG" sha256sums.txt; then
            shasum -a 256 "$DMG" >> sha256sums.txt
            gh release upload "$V" sha256sums.txt --clobber --repo "${{ github.repository }}"
          fi
          echo "--- 当前资产清单 ---"
          gh release view "$V" --repo "${{ github.repository }}" --json assets --jq '.assets[].name'
