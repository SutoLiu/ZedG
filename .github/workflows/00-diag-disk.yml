name: 00 诊断磁盘（临时，用完删除）

on:
  workflow_dispatch:

jobs:
  amd64:
    runs-on: windows-latest
    steps:
      - name: 磁盘与硬件信息
        shell: pwsh
        run: |
          Write-Host "=== 镜像: windows-latest (amd64) ==="
          Write-Host "Runner: $env:RUNNER_NAME"
          Get-CimInstance Win32_ComputerSystem |
            Select-Object @{n='RAM_GB';e={[math]::Round($_.TotalPhysicalMemory/1GB,1)}} |
            Format-List
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores |
            Format-List
          Write-Host "--- 本地磁盘 ---"
          Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" |
            Select-Object DeviceID, VolumeName,
              @{n='SizeGB';e={[math]::Round($_.Size/1GB,1)}},
              @{n='FreeGB';e={[math]::Round($_.FreeSpace/1GB,1)}} |
            Format-Table -AutoSize | Out-String | Write-Host
          Write-Host "--- PSDrive ---"
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} |
            Format-Table -AutoSize | Out-String | Write-Host

  arm64:
    runs-on: windows-11-arm
    steps:
      - name: 磁盘与硬件信息
        shell: pwsh
        run: |
          Write-Host "=== 镜像: windows-11-arm (arm64) ==="
          Write-Host "Runner: $env:RUNNER_NAME"
          Get-CimInstance Win32_ComputerSystem |
            Select-Object @{n='RAM_GB';e={[math]::Round($_.TotalPhysicalMemory/1GB,1)}} |
            Format-List
          Get-CimInstance Win32_Processor |
            Select-Object Name, NumberOfCores |
            Format-List
          Write-Host "--- 本地磁盘 ---"
          Get-CimInstance Win32_LogicalDisk -Filter "DriveType=3" |
            Select-Object DeviceID, VolumeName,
              @{n='SizeGB';e={[math]::Round($_.Size/1GB,1)}},
              @{n='FreeGB';e={[math]::Round($_.FreeSpace/1GB,1)}} |
            Format-Table -AutoSize | Out-String | Write-Host
          Write-Host "--- PSDrive ---"
          Get-PSDrive -PSProvider FileSystem |
            Select-Object Name, @{n='FreeGB';e={[math]::Round($_.Free/1GB,1)}} |
            Format-Table -AutoSize | Out-String | Write-Host
