name: 99 手动发布（临时）

# 用途：构建 run 因某个平台卡死无法走到 release 时，
# 直接从已完成的 build job artifacts 组装并发布，无需本地下载。

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "源构建 run ID（如 41572832970）"
        required: true
        type: string
      version:
        description: "发布 tag（如 v1.26.2）"
        required: true
        type: string
      lang:
        description: "语言"
        default: zh-CN
        type: string
      note:
        description: "附加说明（会追加到正文顶部）"
        default: ""
        type: string

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      V: ${{ inputs.version }}
      L: ${{ inputs.lang }}
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          pattern: zed-*
          path: artifacts

      - name: 下载补丁与源码
        uses: actions/download-artifact@v4
        with:
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          name: l10n-patch
          path: artifacts/l10n-patch

      - name: 列出产物
        run: find artifacts -type f | sort

      - name: 整理文件与生成 Hash
        run: |
          mkdir -p release-dist
          LANG_LOWER=$(echo "$L" | tr '[:upper:]' '[:lower:]')
          find artifacts -mindepth 2 -maxdepth 2 -type f -exec cp {} release-dist/ \;
          cp artifacts/l10n-patch/l10n.patch "release-dist/zedg-${LANG_LOWER}-l10n-${V}.patch" 2>/dev/null || true
          cp artifacts/l10n-patch/l10n-source.tar.gz "release-dist/zedg-${LANG_LOWER}-source-${V}.tar.gz" 2>/dev/null || true
          cd release-dist
          sha256sum * > sha256sums.txt
          echo "---- 待发布 ----"
          ls -lh

      - name: 安装依赖
        run: pip install ".[ai]"

      - name: 生成发布正文
        env:
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
        run: |
          LANG_LOWER=$(echo "$L" | tr '[:upper:]' '[:lower:]')
          zedl10n release-notes \
            --version "$V" \
            --lang "$L" \
            --translation-file "i18n/${V}/${L}.json" \
            --output /tmp/release_body.md || echo "正文生成失败，使用占位" 
          if [ ! -s /tmp/release_body.md ]; then
            printf '## ZedG %s\n\n简体中文本地化构建版本。\n' "$V" > /tmp/release_body.md
          fi
          if [ -n "${{ inputs.note }}" ]; then
            printf '%s\n\n' "${{ inputs.note }}" | cat - /tmp/release_body.md > /tmp/body.md
            mv /tmp/body.md /tmp/release_body.md
          fi
          head -20 /tmp/release_body.md

      - name: 发布 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.version }}
          name: Zed Globalization 简体中文 ${{ inputs.version }}
          body_path: /tmp/release_body.md
          files: release-dist/*
          draft: false
          prerelease: false
