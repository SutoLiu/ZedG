name: 05 更新 Scoop Manifest

# ZedG Release 发布后，自动生成 Windows x64/ARM64 的 Scoop manifest
# 并推送到 wenyinos/scoop-zedg。需要仓库 Secret: TAP_GITHUB_TOKEN
# （fine-grained PAT，对 scoop-zedg 与 homebrew-zedg 有 Contents 写权限）。

on:
  release:
    types: [published]
  # 02 构建用 GITHUB_TOKEN 创建 release，不会触发上方 release 事件，
  # 因此监听构建工作流完成（旧仓库 Homebrew 工作流同样处理）。
  workflow_run:
    workflows: ["02 构建发行"]
    types: [completed]
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release tag（如 v1.26.2，留空取最新 stable）"
        required: false
        type: string

permissions:
  contents: read

jobs:
  update-bucket:
    runs-on: ubuntu-latest
    steps:
      - name: 确定目标版本
        env:
          GH_REPO: ${{ github.repository }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          EVENT_PRE: ${{ github.event.release.prerelease }}
          INPUT_TAG: ${{ inputs.version_tag }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_run" ] && [ "${{ github.event.workflow_run.conclusion }}" != "success" ]; then
            echo "构建未成功，跳过"; echo "SKIP=true" >> $GITHUB_ENV; exit 0
          fi
          if [ -n "$INPUT_TAG" ]; then
            TAG="$INPUT_TAG"
          elif [ -n "$EVENT_TAG" ]; then
            TAG="$EVENT_TAG"
          else
            TAG=$(curl -s "https://api.github.com/repos/${GH_REPO}/releases/latest" | jq -r .tag_name)
          fi
          IS_PRE=$(curl -s "https://api.github.com/repos/${GH_REPO}/releases/tags/$TAG" | jq -r '.prerelease // false')
          if [ "$IS_PRE" = "true" ] && [ -z "$INPUT_TAG" ]; then
            echo "跳过 pre-release: $TAG"
            echo "SKIP=true" >> $GITHUB_ENV
          fi
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "目标版本: $TAG (prerelease=$IS_PRE)"

      - name: 等待并获取 Windows 产物
        if: env.SKIP != 'true'
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          for i in $(seq 1 20); do
            JSON=$(curl -s "https://api.github.com/repos/${GH_REPO}/releases/tags/$TAG")
            URL_X64=$(echo "$JSON" | jq -r '.assets[] | select(.name | test("windows-x86_64.*\\.zip$")) | .browser_download_url' | head -1)
            URL_ARM64=$(echo "$JSON" | jq -r '.assets[] | select(.name | test("windows-aarch64.*\\.zip$")) | .browser_download_url' | head -1)
            if [ -n "$URL_X64" ] && [ "$URL_X64" != "null" ]; then
              echo "ASSET_X64=$URL_X64" >> $GITHUB_ENV
              echo "ASSET_ARM64=$URL_ARM64" >> $GITHUB_ENV
              break
            fi
            echo "[$i/20] 产物未就绪，等待 15s..."
            sleep 15
          done
          [ -n "$ASSET_X64" ] || { echo "::error::未找到 $TAG 的 Windows x64 产物"; exit 1; }

      - name: 生成 manifest
        if: env.SKIP != 'true'
        env:
          GH_REPO: ${{ github.repository }}
        run: |
          CLEAN="${TAG#v}"
          REPO_URL="https://github.com/${GH_REPO}"
          HASH_X64=$(tmp=$(mktemp); curl -sL -o "$tmp" "$ASSET_X64"; sha256sum "$tmp" | awk '{print $1}'; rm -f "$tmp")
          HASH_ARM64=""
          if [ -n "$ASSET_ARM64" ] && [ "$ASSET_ARM64" != "null" ]; then
            HASH_ARM64=$(tmp=$(mktemp); curl -sL -o "$tmp" "$ASSET_ARM64"; sha256sum "$tmp" | awk '{print $1}'; rm -f "$tmp")
          fi

          MANIFEST=$(jq -n \
            --arg version "$CLEAN" \
            --arg desc "Zed Editor (Localized / 汉化版)" \
            --arg homepage "$REPO_URL" \
            --arg url_x64 "$ASSET_X64" \
            --arg hash_x64 "$HASH_X64" \
            --arg au_x64_url "${REPO_URL}/releases/download/v\$version/zedg-zh-cn-windows-x86_64-v\$version.zip" \
            --arg au_hash "${REPO_URL}/releases/download/v\$version/sha256sums.txt" \
            --arg au_x64_regex '([a-f0-9]{64})\s+zedg-zh-cn-windows-x86_64-v\$version\.zip' \
            '{
              version: $version, description: $desc, homepage: $homepage,
              license: "GPL-3.0-only",
              architecture: {"64bit": {url: $url_x64, hash: $hash_x64}},
              bin: [["bin\\ZedG.exe", "zedg"]],
              shortcuts: [["ZedG.exe", "ZedG"]],
              checkver: {github: $homepage},
              autoupdate: {architecture: {"64bit": {
                url: $au_x64_url,
                hash: {url: $au_hash, regex: $au_x64_regex}
              }}}
            }')

          if [ -n "$HASH_ARM64" ]; then
            MANIFEST=$(echo "$MANIFEST" | jq \
              --arg url "$ASSET_ARM64" --arg hash "$HASH_ARM64" \
              --arg au_url "${REPO_URL}/releases/download/v\$version/zedg-zh-cn-windows-aarch64-v\$version.zip" \
              --arg au_hash "${REPO_URL}/releases/download/v\$version/sha256sums.txt" \
              --arg au_regex '([a-f0-9]{64})\s+zedg-zh-cn-windows-aarch64-v\$version\.zip' \
              '.architecture.arm64 = {url: $url, hash: $hash} |
               .autoupdate.architecture.arm64 = {url: $au_url, hash: {url: $au_hash, regex: $au_regex}}')
          fi

          mkdir -p out
          echo "$MANIFEST" > out/zedg.json
          echo "--- zedg.json ---"
          cat out/zedg.json

      - name: 推送到发布源
        if: env.SKIP != 'true'
        env:
          TAP_PAT: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          [ -n "$TAP_PAT" ] || { echo "::error::未配置 TAP_GITHUB_TOKEN secret"; exit 1; }
          git clone --depth 1 "https://x-access-token:${TAP_PAT}@github.com/wenyinos/scoop-zedg.git" /tmp/bucket
          cd /tmp/bucket
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main
          cp "$GITHUB_WORKSPACE/out/zedg.json" zedg.json
          git add zedg.json
          if git diff --cached --quiet; then
            echo "Manifest 无变化，跳过"
          else
            git commit -m "chore: 更新 zedg 到 $TAG"
            git push origin main
            echo "已推送 zedg.json ($TAG)"
          fi
